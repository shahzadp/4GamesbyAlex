<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="72%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#293d31" />
      <stop offset="72%" stop-color="#1a2921" />
      <stop offset="100%" stop-color="#111a16" />
    </radialGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>
  <rect width="400" height="500" rx="30" fill="url(#bgGrad)" stroke="#53695a" stroke-opacity="0.65" stroke-width="2" />
  <ellipse cx="200" cy="460" rx="90" ry="25" fill="#0a120d" opacity="0.7" filter="url(#shadowBlur)">
