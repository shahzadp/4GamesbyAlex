      <rect x="245" y="330" width="25" height="55" rx="12.5" fill="#F8C784" stroke="#D3834B" stroke-width="3" />
      <ellipse cx="257.5" cy="385" rx="16" ry="10" fill="#FFF5E1" stroke="#D3834B" stroke-width="3" />
    </g>
