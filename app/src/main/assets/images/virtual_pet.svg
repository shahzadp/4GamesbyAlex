      <path d="M 340 430 C 335 450, 300 460, 280 440 C 290 425, 310 415, 325 420 C 335 425, 340 425, 340 430 Z" fill="#FFF5E1" stroke="#D3834B" stroke-width="3" stroke-linejoin="round" />
