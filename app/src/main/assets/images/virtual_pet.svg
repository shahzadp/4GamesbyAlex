          <ellipse cx="0" cy="0" rx="18" ry="10" fill="#2C2C2C" />
          <path d="M -10 0 Q 0 15 10 0 Z" fill="#FF6B8B" />
          <path d="M -5 3 Q 0 8 5 3" fill="none" stroke="#FFA3B5" stroke-width="2" stroke-linecap="round" />
