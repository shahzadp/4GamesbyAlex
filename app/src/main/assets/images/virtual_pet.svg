      <rect x="225" y="410" width="30" height="60" rx="15" fill="#F8C784" stroke="#D3834B" stroke-width="3" />
      <ellipse cx="240" cy="470" rx="22" ry="12" fill="#FFF5E1" stroke="#D3834B" stroke-width="3" />
    </g>
    <g id="body">
